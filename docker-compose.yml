services:
  postgres:
    image: postgres:18-alpine
    container_name: ecom_inv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_dev_password
      POSTGRES_DB: ecom_inv
    ports:
      - "5433:5432"
    volumes:
      # PG18 images store data in a version subdir; mount the parent, not /data.
      - ecom_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_inv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecom_pgdata:
